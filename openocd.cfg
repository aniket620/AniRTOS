# OpenOCD config for the NUCLEO-F446RE's onboard ST-Link/V2-1.
#
# Usage:
#   Flash + verify + reset + exit:
#     openocd -f openocd.cfg -c "program build/anirtos.elf verify reset exit"
#   (equivalently: cmake --build build --target flash)
#
#   Interactive debug session (leave running in one terminal):
#     openocd -f openocd.cfg
#   then in another terminal:
#     gdb-multiarch build/anirtos.elf -ex "target extended-remote :3333"
#
# Unlike the Blue Pill + external ST-Link setup, there's no wiring here:
# the Nucleo's onboard ST-Link/V2-1 debug probe is already connected to
# the target MCU (STM32F446RE) on the same board. Just plug in the USB
# cable and OpenOCD will find it.

source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

adapter speed 4000
